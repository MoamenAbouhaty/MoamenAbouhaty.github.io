<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Moamen Abouhaty - Backend Engineer" />

    <title>Moamen Abouhaty | Backend Engineer</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --background: #e8f5f3;
        --primary: #0d3b3e;
        --secondary: #297373;
        --text: #111111;
        --muted: #526666;
        --white: #ffffff;
      }

      body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;

        background: radial-gradient(
          circle at top,
          #ffffff 0%,
          var(--background) 55%,
          #dcefed 100%
        );

        color: var(--text);

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 30px;
      }

      .container {
        width: 100%;
        max-width: 650px;
        text-align: center;
      }

      /* Profile Image */

      .profile-image {
        width: 180px;
        height: 180px;

        object-fit: cover;

        border-radius: 50%;

        border: 6px solid var(--white);

        box-shadow: 0 15px 40px rgba(13, 59, 62, 0.2);

        margin-bottom: 28px;
      }

      /* Name */

      h1 {
        color: var(--primary);

        font-size: clamp(2.2rem, 7vw, 4rem);

        line-height: 1.1;

        margin-bottom: 12px;
      }

      /* Job Title */

      .title {
        color: var(--secondary);

        font-size: 1.25rem;

        font-weight: 600;

        margin-bottom: 22px;
      }

      /* Description */

      .description {
        max-width: 560px;

        margin: 0 auto 30px;

        color: var(--muted);

        font-size: 1rem;

        line-height: 1.8;
      }

      /* Social Links */

      .links {
        display: flex;

        justify-content: center;

        gap: 14px;

        flex-wrap: wrap;
      }

      .links a {
        display: inline-block;

        padding: 12px 22px;

        border-radius: 10px;

        text-decoration: none;

        font-weight: 600;

        transition: 0.25s ease;
      }

      .github {
        background: var(--primary);
        color: var(--white);
      }

      .linkedin {
    background: #0A66C2;
    color: #ffffff;

    display: inline-flex !important;
    align-items: center;
    justify-content: center;

    gap: 9px;

    padding: 12px 22px;

    border-radius: 10px;

    text-decoration: none;

    font-weight: 600;

    transition: 0.25s ease;
}

.linkedin-icon {
    width: 21px;
    height: 21px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #ffffff;
    color: #0A66C2;

    border-radius: 3px;

    font-family: Arial, sans-serif;
    font-size: 15px;
    font-weight: 800;

    line-height: 1;
}

.linkedin:hover {
    background: #004182;
    transform: translateY(-3px);

    box-shadow:
        0 8px 20px rgba(10, 102, 194, 0.25);
}

      .links a:hover {
        transform: translateY(-3px);

        box-shadow: 0 8px 20px rgba(13, 59, 62, 0.18);
      }

      /* Footer */

      footer {
        margin-top: 45px;

        color: #718383;

        font-size: 0.85rem;
      }

      /* Mobile */

      @media (max-width: 500px) {
        body {
          padding: 20px;
        }

        .profile-image {
          width: 145px;
          height: 145px;
        }

        .description {
          font-size: 0.95rem;
        }

        .links {
          flex-direction: column;
        }

        .links a {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <main class="container">
      <!-- Your Personal Photo -->
      <img src="Hero.png" alt="Moamen Abouhaty" class="profile-image" />

      <!-- Name -->
      <h1>Moamen Abouhaty</h1>

      <!-- Profession -->
      <div class="title">Backend Engineer</div>

      <!-- Short Introduction -->
      <p class="description">
        Backend Engineer focused on building reliable backend applications, REST
        APIs, and AI-powered solutions using Node.js and modern backend
        technologies.
      </p>

      <!-- Social Links -->
      <div class="links">
   <a
    class="linkedin"
    href="https://www.linkedin.com/in/moamen-elsayed-abouhaty/"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="LinkedIn"
>
    <span class="linkedin-icon">in</span>
    <span>LinkedIn</span>
</a>
      </div>

      <footer>© 2026 Moamen Abouhaty</footer>
    </main>
  </body>
</html>
